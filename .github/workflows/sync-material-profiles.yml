name: Sync material profiles

on:
  push:
    branches: [main]
    paths:
      - 'data/createmyway/slag/materials/*.json'
      - 'create_my_way_material_generator.py'
      - '.github/workflows/sync-material-profiles.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: material-profiles-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate names and acquisition recipes
        run: python create_my_way_material_generator.py

      - name: Commit generated files when changed
        run: |
          git add assets/createmyway/lang/en_us.json server_scripts/generated_cmw_material_recipes.js
          if git diff --cached --quiet; then
            echo 'Generated files already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: sync generated material names and recipes'
          git push origin HEAD:main
